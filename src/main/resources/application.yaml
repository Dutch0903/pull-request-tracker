spring:
  main:
    banner-mode: off
    web-application-type: none
    register-shutdown-hook: true

  application:
    name: pull-request-tracker

  lifecycle:
    timeout-per-shutdown-phase: 10s

repository-check:
  interval-ms: 600000
  thread-pool-size: 4

repository-stats:
  stale-threshold-days: 14
  recent-activity-max-entries: 5

logging:
  file:
    name: logs/application.log

  pattern:
    file: '%d{yyyy-MM-dd HH:mm:ss} - %msg%n'
    console: ''